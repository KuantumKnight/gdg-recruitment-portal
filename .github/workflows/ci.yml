name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
  FIREBASE_PROJECT_ID: demo-gdg-recruitment
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-gdg-recruitment
  BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough
  BETTER_AUTH_URL: http://127.0.0.1:3000
  VIT_EMAIL_DOMAINS: vitstudent.ac.in,vit.ac.in

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - run: bunx firebase emulators:start --only firestore --project demo-gdg-recruitment > "$RUNNER_TEMP/firestore.log" 2>&1 &
      - run: timeout 60 bash -c 'until nc -z 127.0.0.1 8080; do sleep 1; done'
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
